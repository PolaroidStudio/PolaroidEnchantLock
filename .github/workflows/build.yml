name: Build & Release

on:
  # Documentation never builds or publishes: Markdown in any folder, docs/, the SDD specs in
  # openspec/ and the repo metadata. A push that also touches code still builds.
  push:
    branches: ["**"]
    tags: [ 'v*' ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
      - '.atl/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
      - '.atl/**'
      - 'LICENSE'
      - '.gitignore'
  # Allows launching a build by hand, which publishes a release from main just like a push.
  #
  # A push whose files all fall under paths-ignore triggers nothing, and neither does an empty
  # commit: it changes no file, so it matches no path. This is the way out.
  workflow_dispatch:

# One build per branch. Pushing twice in a row cancels the previous run instead of queueing it
# to compete for the runner's CPU.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to compute the changelog.
          fetch-depth: 0

      # Gradle runs on Java 21 and the Java 21 toolchain (JAVA_HOME_21_X64, configured in
      # gradle.properties) compiles the plugin targeting Java 21.
      # options.release.set(21) in build.gradle.kts is the real guarantee: the same jar runs
      # unchanged on a Java 21 server (1.21.x) or a Java 25 one (26.1+).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests (set registry, reference parsing, name rules, lock rules, sets.yml), before the jar.
      #
      # They run on main too, so a failure stops the release instead of publishing a jar nobody
      # tested: work reaches main by direct push without a pull request, so nothing else would
      # have run them against what main actually contains.
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Build
        run: ./gradlew jar --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Version read from the file (avoids a second Gradle invocation).
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -1 | cut -d'=' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate changelog
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: changelog
        shell: bash
        run: |
          # Nearest tag in HEAD's history = the previous release. describe (topological) is used
          # rather than a version sort, which breaks if the version scheme ever changed.
          # Commits are grouped by conventional-commit type and the noise is dropped.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE=""; RANGE_DESC="the beginning"
          else
            RANGE="$PREV_TAG..HEAD"; RANGE_DESC="$PREV_TAG"
          fi

          # hash <TAB> subject <TAB> author <TAB> email, without merges (integration noise).
          # The email carries the GitHub username, which is what links to a profile; the author
          # name does not have to match it.
          COMMITS=$(git log $RANGE --no-merges --pretty=format:'%h%x09%s%x09%an%x09%ae')
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          feat=""; fix=""; perf=""; brk=""; other=""
          while IFS=$'\t' read -r hash subject author email; do
            [ -z "$subject" ] && continue
            # type(scope)!: description  — scope and '!' optional.
            if [[ "$subject" =~ ^([a-zA-Z]+)(\([^\)]*\))?(!)?:[[:space:]]*(.*)$ ]]; then
              type="${BASH_REMATCH[1]}"; bang="${BASH_REMATCH[3]}"; desc="${BASH_REMATCH[4]}"
            else
              type="_"; bang=""; desc="$subject"
            fi
            # The hash links to its commit; the author, to their profile. A GitHub noreply email
            # has the form id+user@users.noreply.github.com, which yields the real username.
            if [[ "$email" =~ ^([0-9]+\+)?([^@]+)@users\.noreply\.github\.com$ ]]; then
              handle="${BASH_REMATCH[2]}"
            else
              handle=""
            fi
            line="- ${desc} ([\`${hash}\`](${REPO_URL}/commit/${hash}))"
            if [ -n "$handle" ]; then
              line+=" by [@${handle}](${{ github.server_url }}/${handle})"
            elif [ -n "$author" ]; then
              line+=" by ${author}"
            fi
            # A commit marked breaking ('!') goes ONLY to Breaking, it is not duplicated.
            if [ -n "$bang" ]; then brk+="${line}"$'\n'; continue; fi
            case "$type" in
              feat) feat+="${line}"$'\n' ;;
              fix)  fix+="${line}"$'\n' ;;
              perf) perf+="${line}"$'\n' ;;
              chore|ci) : ;;   # noise: kept out of the release
              *)    other+="${line}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          CL=""
          [ -n "$brk" ]   && CL+=$'### ⚠️ Breaking Changes\n'"$brk"$'\n'
          [ -n "$feat" ]  && CL+=$'### ✨ Features\n'"$feat"$'\n'
          [ -n "$fix" ]   && CL+=$'### 🐛 Fixes\n'"$fix"$'\n'
          [ -n "$perf" ]  && CL+=$'### ⚡ Performance\n'"$perf"$'\n'
          [ -n "$other" ] && CL+=$'<details><summary>Other changes</summary>\n\n'"$other"$'</details>\n'
          [ -z "$CL" ]    && CL="- No relevant changes since ${RANGE_DESC}"

          # Footer with the full diff against the previous release, which the changelog summarizes.
          TAG="v${{ steps.version.outputs.version }}-b${{ github.run_number }}"
          if [ -n "$PREV_TAG" ]; then
            CL+=$'\n---\n\n'"**All changes**: [\`${PREV_TAG}...${TAG}\`](${REPO_URL}/compare/${PREV_TAG}...${TAG})"$'\n'
          fi

          {
            echo "CHANGELOG<<GH_CHANGELOG_EOF"
            printf '%s\n' "$CL"
            echo "GH_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Fails early with a clear message if Gradle did not produce the jar, instead of publishing
      # a Release with no attachments.
      - name: Verify artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          V="${{ steps.version.outputs.version }}"
          JAR="build/libs/PolaroidEnchantLock-${V}-b${{ github.run_number }}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Missing expected artifact: $JAR"
            echo "Contents of build/libs:"; ls -la build/libs || true
            exit 1
          fi

      - name: Create Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-b${{ github.run_number }}
          name: "PolaroidEnchantLock v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Artifact

            | File | Where it goes |
            |---|---|
            | `PolaroidEnchantLock-${{ steps.version.outputs.version }}-b${{ github.run_number }}.jar` | `plugins/` of the Paper server |
          files: build/libs/PolaroidEnchantLock-${{ steps.version.outputs.version }}-b${{ github.run_number }}.jar
          generate_release_notes: false
          make_latest: true

      # Branches do not upload the jar: it eats the account's Actions storage, and the Release
      # main publishes already exists for real testing. What matters about a branch build is that
      # it compiles and the tests pass, and the run's status already reflects that.
